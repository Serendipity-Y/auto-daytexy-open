{% if pagination.page_count > 1 %}
<nav class="ledger-pagination" aria-label="列表翻页" data-list-pagination>
  {% if pagination.previous_url %}<a class="command-button command-button--quiet" href="{{ pagination.previous_url }}">上一页</a>{% endif %}
  <span>第 {{ pagination.page }} / {{ pagination.page_count }} 页 · 共 {{ pagination.total_count }} 条</span>
  {% if pagination.next_url %}<a class="command-button command-button--quiet" href="{{ pagination.next_url }}">下一页</a>{% endif %}
</nav>
{% endif %}
